-- PostgreSQL Performance Configuration
-- Recommended settings for a server with 4GB RAM

-- Connection Settings
max_connections = 100                    -- Maximum number of connections
shared_buffers = 1GB                     -- 25% of total RAM
effective_cache_size = 3GB               -- 75% of total RAM  
maintenance_work_mem = 256MB             -- For VACUUM, CREATE INDEX operations
work_mem = 10MB                          -- Per-query sort/hash memory

-- Write Ahead Log (WAL) Settings
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 80MB

-- Query Planner Settings
default_statistics_target = 100          -- More statistics for better query plans
random_page_cost = 1.1                   -- Optimized for SSD storage
effective_io_concurrency = 200           -- For SSD

-- Logging Settings (for query optimization)
log_min_duration_statement = 1000        -- Log queries slower than 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

-- Autovacuum Settings (important for performance)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

-- Parallel Query Settings
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

-- Usage Instructions:
-- 1. Backup your current postgresql.conf
-- 2. Add these settings to postgresql.conf (usually in /etc/postgresql/[version]/main/)
-- 3. Restart PostgreSQL: sudo systemctl restart postgresql
-- 4. Verify settings: SELECT name, setting FROM pg_settings WHERE name IN ('shared_buffers', 'work_mem', 'maintenance_work_mem');
